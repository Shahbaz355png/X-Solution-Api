services:
  - type: web
    name: xsolution-api
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: API_KEY
        generateValue: true
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        generateValue: true
